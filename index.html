<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J & B Autos Matrix</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏎️</text></svg>">
<style>
  :root {
    --primary: #00ffcc; /* Neon Cyan */
    --danger: #ff3333;  /* Alert Red */
    --dark: #070707;
    --panel: #121212;
    --card: #1a1a1a;
    --text: #e0e0e0;
    --border: #2a2a2a;
  }
  body {
    background-color: var(--dark);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 10px;
  }
  .container {
    max-width: 480px;
    margin: 0 auto;
    background: var(--panel);
    padding: 15px;
    border-radius: 12px;
    border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,0.9);
  }
  h2 {
    color: var(--primary);
    text-align: center;
    text-transform: uppercase;
    font-size: 22px;
    margin: 5px 0 20px 0;
    letter-spacing: 2px;
    font-weight: 900;
  }
  
  /* Zone Architecture */
  .zone {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
  }
  .zone-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #888;
    margin-bottom: 15px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
  }
  
  /* Input Styling */
  .input-group { margin-bottom: 12px; }
  .input-group:last-child { margin-bottom: 0; }
  label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #bbb;
    margin-bottom: 6px;
    text-transform: uppercase;
    font-weight: bold;
  }
  input {
    width: 100%;
    padding: 14px;
    background: #000;
    border: 1px solid #333;
    color: #fff;
    font-size: 18px;
    font-weight: bold;
    border-radius: 6px;
    box-sizing: border-box;
    transition: 0.2s all;
  }
  input:focus { border-color: var(--primary); outline: none; }
  
  /* Specific Inputs */
  input.readonly { color: #666; background: #0a0a0a; border-color: #1a1a1a; }
  input.danger { border-color: var(--danger); color: var(--danger); background: rgba(255, 51, 51, 0.05); }
  input.lynchpin { border: 1px solid var(--primary); color: var(--primary); font-size: 20px; background: rgba(0, 255, 204, 0.05); }
  
  /* Buttons */
  .toggle-container { display: flex; gap: 10px; margin-bottom: 15px; }
  .toggle-btn {
    flex: 1; padding: 12px 5px; background: #000; border: 1px solid var(--border);
    color: #666; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 14px;
  }
  .toggle-btn span { display: block; font-size: 10px; font-weight: normal; margin-top: 4px; }
  .toggle-btn.active { background: rgba(0, 255, 204, 0.1); border-color: var(--primary); color: var(--primary); }
  
  .quick-btn {
    background: #222; color: #aaa; border: 1px solid #444; border-radius: 4px; padding: 2px 8px; font-size: 10px; cursor: pointer; text-transform: uppercase;
  }
  .quick-btn:active { background: var(--primary); color: #000; }
  
  .btn-reset {
    display: block; width: 100%; background: #222; color: #888; padding: 15px; text-align: center; font-weight: bold; text-transform: uppercase; border: 1px solid #333; border-radius: 6px; cursor: pointer; margin-top: 15px; font-size: 14px;
  }
  
  /* Results Math */
  .result-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #aaa; }
  .result-row.total {
    border-top: 1px dashed #444; padding-top: 15px; margin-top: 10px; align-items: center;
  }
  .result-row.total span:first-child { font-size: 16px; font-weight: bold; color: #fff; text-transform: uppercase; }
  .result-row.total span:last-child { font-size: 32px; font-weight: 900; color: var(--primary); }
</style>
</head>
<body>

<div class="container">
  <h2>The Matrix</h2>
  
  <div class="toggle-container">
    <button id="btn-advanced" class="toggle-btn" onclick="setMembership('advanced')">ADVANCED<span>5% or $349</span></button>
    <button id="btn-premium" class="toggle-btn active" onclick="setMembership('premium')">PREMIUM<span>4% or $150</span></button>
  </div>

  <!-- ZONE A: MARKET REALITY -->
  <div class="zone zone-a">
    <div class="zone-title">Zone A: Market Reality</div>
    <div class="input-group">
      <label>Target Resale Price (WI)</label>
      <input type="number" id="resale" value="6500" oninput="updateFromTop()" onkeyup="updateFromTop()" onchange="updateFromTop()">
    </div>
    <div class="input-group">
      <label>Desired Profit Margin</label>
      <input type="number" id="profit" value="2000" oninput="updateFromTop()" onkeyup="updateFromTop()" onchange="updateFromTop()">
    </div>
  </div>

  <!-- ZONE B: THE FRICTION -->
  <div class="zone zone-b">
    <div class="zone-title">Zone B: The Friction (Hard Costs)</div>
    <div class="input-group">
      <label>Estimated Repairs & Parts</label>
      <input type="number" id="repairs" value="800" oninput="updateFromTop()" onkeyup="updateFromTop()" onchange="updateFromTop()">
    </div>
    <div class="input-group">
      <label>
        Freight / Hauler
        <button class="quick-btn" onclick="setQuickFreight(600)">Set $600 Slot</button>
      </label>
      <input type="number" id="freight" value="600" oninput="updateFromTop()" onkeyup="updateFromTop()" onchange="updateFromTop()">
    </div>
    <div class="input-group" style="display: flex; gap: 10px;">
      <div style="flex: 1;">
        <label>Processing</label>
        <input type="number" id="processingFee" class="readonly" value="150" readonly>
      </div>
    </div>
  </div>

  <!-- ZONE C: EXECUTION -->
  <div class="zone zone-c">
    <div class="zone-title">Zone C: Execution (The Lynchpin)</div>
    <div class="input-group">
      <label style="color: var(--primary);">Max Total Outlay Allowed</label>
      <input type="number" id="maxOutlayInput" class="lynchpin" value="0" oninput="updateFromOutlay()" onkeyup="updateFromOutlay()">
    </div>

    <div style="margin-top: 20px;">
      <div class="result-row">
        <span>Est. Auction/Gate Fees:</span>
        <span id="estAuctionFees">$0</span>
      </div>
      <div class="result-row">
        <span>ABM Broker Fee:</span>
        <span id="brokerFeeDisplay">$0</span>
      </div>
      <div class="result-row">
        <span>Verified Total Landed Cost:</span>
        <span id="calcTotalOutlay">$0</span>
      </div>
      <div class="result-row total">
        <span>Max Bid:</span>
        <span id="maxBid">$0</span>
      </div>
    </div>
  </div>

  <button class="btn-reset" onclick="window.location.reload()">System Reset</button>
</div>

<script>
// System State
let activeMembership = 'premium';

function setMembership(level) {
  activeMembership = level;
  document.getElementById('btn-advanced').classList.remove('active');
  document.getElementById('btn-premium').classList.remove('active');
  document.getElementById('btn-' + level).classList.add('active');
  calculateCurrentState();
}

function setQuickFreight(amount) {
  document.getElementById('freight').value = amount;
  updateFromTop();
}

// Copart Breakpoints
function getAuctionFees(bid) {
  if (bid <= 1500) return 628;
  if (bid <= 1800) return 678;
  if (bid <= 2500) return 718; 
  if (bid <= 3450) return 848; 
  if (bid <= 3950) return 923; 
  if (bid <= 4000) return 968;
  if (bid <= 4500) return 1003;
  if (bid <= 5000) return 1008;
  if (bid <= 7000) return 1338;
  if (bid <= 10000) return 1798;
  if (bid <= 20000) return 3298;
  return 3298; 
}

// Visual Tripwire for Margin Safety
function checkProfitHealth() {
  const profitInput = document.getElementById('profit');
  const profitVal = parseFloat(profitInput.value) || 0;
  
  if (profitVal < 1000) {
    profitInput.classList.add('danger');
  } else {
    profitInput.classList.remove('danger');
  }
}

// Route 1: Top-Down Execution
function updateFromTop() {
  const resale = parseFloat(document.getElementById('resale').value) || 0;
  const profit = parseFloat(document.getElementById('profit').value) || 0;
  const repairs = parseFloat(document.getElementById('repairs').value) || 0;
  const freight = parseFloat(document.getElementById('freight').value) || 0;

  const calculatedOutlay = resale - profit - repairs - freight;
  document.getElementById('maxOutlayInput').value = calculatedOutlay;
  
  checkProfitHealth();
  executeBidMath(calculatedOutlay);
}

// Route 2: Bottom-Up Reverse Engineering
function updateFromOutlay() {
  const outlay = parseFloat(document.getElementById('maxOutlayInput').value) || 0;
  const resale = parseFloat(document.getElementById('resale').value) || 0;
  const repairs = parseFloat(document.getElementById('repairs').value) || 0;
  const freight = parseFloat(document.getElementById('freight').value) || 0;

  const adjustedProfit = resale - outlay - repairs - freight;
  document.getElementById('profit').value = adjustedProfit;

  checkProfitHealth();
  executeBidMath(outlay);
}

// Route 3: Toggle Shifts
function calculateCurrentState() {
  const outlay = parseFloat(document.getElementById('maxOutlayInput').value) || 0;
  executeBidMath(outlay);
}

// Core Mathematical Engine
function executeBidMath(maxOutlay) {
  const processingFee = parseFloat(document.getElementById('processingFee').value) || 0;
  
  let bestBid = 0;
  let bestAuctionFees = 0;
  let bestBrokerFee = 0;
  let bestTotal = 0;

  for (let testBid = 100; testBid <= 30000; testBid += 1) {
    let aFees = getAuctionFees(testBid);
    let bFee = 0;
    
    if (activeMembership === 'advanced') {
      bFee = Math.max(349, testBid * 0.05);
    } else {
      bFee = Math.max(150, testBid * 0.04);
    }
    
    let totalCost = testBid + aFees + bFee + processingFee;
    
    if (totalCost <= maxOutlay) {
      bestBid = testBid;
      bestAuctionFees = aFees;
      bestBrokerFee = bFee;
      bestTotal = totalCost;
    } else {
      break; 
    }
  }

  document.getElementById('estAuctionFees').innerText = '$' + bestAuctionFees.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('brokerFeeDisplay').innerText = '$' + bestBrokerFee.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('calcTotalOutlay').innerText = '$' + bestTotal.toLocaleString(undefined, {maximumFractionDigits: 0});
  document.getElementById('maxBid').innerText = '$' + bestBid.toLocaleString(undefined, {maximumFractionDigits: 0});
}

// Boot
updateFromTop();
</script>

</body>
</html>
